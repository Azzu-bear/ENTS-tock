---
name: docs

env:
  TERM: xterm
  python_version: "3.x"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Allow one deployment at a time, and let a newer push supersede an in-flight
# one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python_version }}

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Install python docs dependencies
        working-directory: ./python
        run: pip install -e .[docs]

      # Not CI=true. The doxygen build currently surfaces around 55 real
      # mistakes in existing comments (@param naming arguments that no longer
      # exist, @retrun typos, @ref pointing at pages nobody wrote). Failing the
      # site build on those would mean no published docs at all until they are
      # cleaned up, which is the wrong trade. The warning log is uploaded below
      # so the count is visible and can be driven down.
      - name: Build embedded docs
        working-directory: ./embedded/doxygen
        run: ./build.sh

      # Sphinx does pass cleanly, so hold it to that.
      - name: Build python docs
        working-directory: ./python/docs
        env:
          CI: "true"
        run: ./build.sh

      - name: Assemble the site
        run: |
          mkdir -p site
          cp docs/index.html site/
          mkdir -p site/embedded site/python
          cp -r embedded/doxygen/build/html/. site/embedded/
          cp -r python/docs/build/html/. site/python/
          # Pages runs the output through Jekyll otherwise, which drops any
          # file or directory beginning with an underscore. Sphinx emits
          # _static and _sources.
          touch site/.nojekyll

      - uses: actions/upload-artifact@v7
        with:
          name: doxygen-warnings
          path: embedded/doxygen/build/doxygen-warnings.log
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Publishing only happens for main. A pull request still builds, so a change
  # that breaks the docs is caught before it merges, but does not deploy.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
